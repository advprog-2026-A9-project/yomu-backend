name: Java CI with Gradle & PMD

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build, Test, and Run PMD
        run: ./gradlew clean build
        env:
          DB_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
          DB_USERNAME: sa
          DB_PASSWORD: password

  deploy-staging:
    name: Deploy to VPS (Staging)
    runs-on: ubuntu-latest
    needs: [ build-and-check ]
    if: github.ref == 'refs/heads/staging'
    steps:
      - name: Execute SSH Commands to Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            cd ~/yomu-backend-staging
            git fetch origin
            git reset --hard origin/staging
            cd ~/yomu-infra/staging
            docker compose up -d --build staging-backend

  deploy-production:
    name: Deploy to VPS (Production)
    runs-on: ubuntu-latest
    needs: [ build-and-check ]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Execute SSH Commands to Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            cd ~/yomu-backend-main
            git fetch origin
            git reset --hard origin/main
            cd ~/yomu-infra/main
            docker compose up -d --build main-backend